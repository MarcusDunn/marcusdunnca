version: 2

updates:
  # ---------------------------------------------------------------------------
  # GitHub Actions. These are pinned to commit SHAs, which Dependabot
  # understands and updates in lockstep with the trailing `# vX.Y.Z` comment.
  # This is the highest-value ecosystem here: a compromised action runs with our
  # OIDC token.
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    # Wait 14 days after a release before proposing it. Long enough for a
    # malicious or broken release to be caught and yanked by someone else.
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
    groups:
      # Non-major bumps ride together in one auto-mergeable PR. Majors are
      # deliberately left ungrouped so each gets human review.
      actions-non-major:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # OpenTofu providers.
  #
  # Dependabot's terraform updater maintains .terraform.lock.hcl as well as the
  # constraints: it runs `terraform providers lock -platform=<arch>` for each
  # architecture already present in the lockfile, so the linux_amd64 /
  # darwin_arm64 / darwin_amd64 set committed here is preserved.
  #
  # Caveat worth watching on the first real provider bump: our lockfiles pin
  # `registry.opentofu.org`, and Dependabot shells out to Terraform. If it
  # resolves hashes against registry.terraform.io instead, its PR will produce a
  # lockfile `tofu init` rejects — noisy rather than silent, but it will need a
  # manual `tofu providers lock` to fix.
  # ---------------------------------------------------------------------------
  - package-ecosystem: terraform
    directories:
      - "/bootstrap"
      - "/infra"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: tofu
    labels:
      - dependencies
      - terraform
    groups:
      providers-non-major:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # The application's own dependencies. Neither ecosystem is auto-merged (see
  # dependabot-auto-merge.yml for why): a bump here ships to production, so
  # each PR is read. Grouped so a quiet week is one PR rather than nine.
  #
  # Security updates for both were already on repository-wide; these blocks add
  # the weekly version updates, which is what keeps an SDK current enough that
  # the next advisory is a lockfile bump rather than a stuck transitive
  # dependency. Advisories that cannot be fixed by a bump are what
  # .github/workflows/audit.yml is for.
  # ---------------------------------------------------------------------------
  - package-ecosystem: cargo
    directory: "/app"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - rust
    groups:
      cargo-non-major:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - javascript
    groups:
      npm-non-major:
        patterns: ["*"]
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # Nix flake inputs (flake.lock). Supported by Dependabot since April 2026,
  # which is what made .github/workflows/update-locks.yml redundant — deleting
  # that workflow removed a scheduled job holding contents+pull-requests write
  # and the machinery that minted GitHub-signed commits outside review.
  #
  # Version updates only; no security updates for this ecosystem.
  # ---------------------------------------------------------------------------
  - package-ecosystem: nix
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    commit-message:
      prefix: nix
    labels:
      - dependencies
      - nix
