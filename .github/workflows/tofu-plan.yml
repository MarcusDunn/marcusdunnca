name: tofu plan

on:
  pull_request:
    branches: [main]

# Least privilege by default. id-token is what mints the OIDC JWT; nothing here
# needs to write to the repo, and plan output goes to the job summary rather
# than a PR comment specifically so we never need `pull-requests: write`.
permissions:
  contents: read
  id-token: write

concurrency:
  group: tofu-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ca-central-1
  TOFU_VERSION: 1.12.5

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest

    # NOTE: there is deliberately no job-level `if:` here.
    #
    # GitHub documents that "a job is skipped by a conditional" makes the job
    # report **Success** to required status checks — unlike a skipped *workflow*,
    # which stays pending and blocks. A job-level `if:` on a required check is
    # therefore not a gate but a free pass: any PR that made the condition false
    # would satisfy `plan (bootstrap)` and `plan (infra)` in seconds, having run
    # no OpenTofu at all.
    #
    # The fork refusal is a failing STEP instead (below). A failing step fails
    # the job; a skipped job passes it. That distinction is the whole point.

    strategy:
      fail-fast: false
      matrix:
        # bootstrap is planned but never auto-applied — it owns the CI roles and
        # the state bucket, so it is human-applied only. Planning it here still
        # catches drift and review-time mistakes.
        module: [bootstrap, infra]

    steps:
      # Must FAIL, not skip — see the note above the strategy block. Runs first,
      # before any checkout, so untrusted branch content is never fetched.
      - name: Refuse pull requests from forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Refusing to plan a PR from a fork (${{ github.event.pull_request.head.repo.full_name }})."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          # The wrapper rewrites exit codes, which would break -detailed-exitcode.
          tofu_wrapper: false

      # Without this, an unset variable makes configure-aws-credentials retry
      # against an empty role ARN until the job times out, which reads as a hang
      # rather than a misconfiguration.
      - name: Verify bootstrap has run
        env:
          ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::error::AWS_PLAN_ROLE_ARN is unset. Run scripts/bootstrap.sh, then scripts/github-setup.sh."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      - name: Check formatting
        run: tofu fmt -check -recursive -diff
        working-directory: ${{ matrix.module }}

      - name: Init
        run: tofu init -input=false -lockfile=readonly -backend-config=backend.hcl
        working-directory: ${{ matrix.module }}

      - name: Validate
        run: tofu validate
        working-directory: ${{ matrix.module }}

      - name: Plan
        id: plan
        working-directory: ${{ matrix.module }}
        # -lock=false keeps the plan role genuinely read-only: it never needs to
        # write a lock object into the state bucket.
        # -detailed-exitcode: 0 = no changes, 1 = error, 2 = changes pending.
        run: |
          set +e
          tofu plan -input=false -lock=false -no-color -detailed-exitcode -out=tfplan > plan.txt 2>&1
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          cat plan.txt
          # Only 0 (no changes) and 2 (changes pending) are successes. Anything
          # else — 1, but also 127 (binary missing), 137 (OOM), 139, 143 — must
          # fail. Testing only for 1 left those green and the required check
          # passing on a plan that never ran.
          case "$code" in
            0|2) ;;
            *) exit 1 ;;
          esac

      - name: Publish plan to job summary
        if: always() && steps.plan.outcome != 'skipped'
        working-directory: ${{ matrix.module }}
        run: |
          {
            echo "### \`${{ matrix.module }}\` plan"
            echo
            if [ "${{ steps.plan.outputs.exitcode }}" = "0" ]; then
              echo "No infrastructure changes."
            else
              echo "Changes pending."
            fi
            echo
            echo '```terraform'
            # Guard against a pathological plan blowing the 1 MiB summary limit.
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Keyed on the PR's AUTHOR, not github.actor. github.actor becomes whoever
      # last pushed to the branch, so an attacker pushing a commit to a
      # dependabot/** branch would make this gate skip entirely while the armed
      # auto-merge stayed live.
      - name: Block automated merges that would change infrastructure
        if: github.event.pull_request.user.login == 'dependabot[bot]' && steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error::Dependabot PR produces a non-empty plan for '${{ matrix.module }}'."
          echo "Auto-merge is only safe for dependency bumps that are a no-op against AWS,"
          echo "because merging to main triggers an immediate apply. Review this one by hand."
          exit 1

  # ---------------------------------------------------------------------------
  # Health of controls that can fail SILENTLY.
  #
  # Two controls in this repo have already reported healthy while being dead:
  # CloudTrail delivered nothing for 108 minutes while IsLogging stayed true and
  # only LatestDeliveryError told the truth, and the SNS alert topic has sat at
  # zero confirmed subscribers while `tofu apply` reported success. Neither
  # `tofu plan` nor the console surfaces either.
  #
  # This job runs on every PR so those failures surface within a day rather than
  # at the next audit.
  # ---------------------------------------------------------------------------
  health:
    name: health
    runs-on: ubuntu-latest

    steps:
      - name: Refuse pull requests from forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-health-${{ github.run_id }}

      # HARD FAIL. A trail that is not delivering is the failure mode that has
      # already bitten, and every claim in the README about being "fully
      # recorded" depends on it.
      - name: CloudTrail is actually delivering
        run: |
          err=$(aws cloudtrail get-trail-status \
            --name marcusdunnca-management-events \
            --query 'LatestDeliveryError' --output text)
          last=$(aws cloudtrail get-trail-status \
            --name marcusdunnca-management-events \
            --query 'LatestDeliveryAttemptSucceeded' --output text)
          echo "last successful delivery: $last"
          if [ "$err" != "None" ] && [ -n "$err" ]; then
            echo "::error::CloudTrail delivery is failing: $err (last success $last)."
            echo "The account is unaudited. Check the trail bucket policy."
            exit 1
          fi
          echo "CloudTrail delivering normally."

      # Root bypasses everything this repo builds — the guardrails, the
      # permissions boundary, Object Lock, even CloudTrail. MFA on root is the
      # only thing standing between the root credentials and total account
      # compromise, and nothing else here would notice if it were removed.
      #
      # Also asserts no root access keys and no IAM users: both should be zero
      # forever, and both are exactly the kind of thing created "temporarily"
      # during an incident and never removed.
      - name: Root account is hardened
        run: |
          summary=$(aws iam get-account-summary --query SummaryMap --output json)
          mfa=$(echo "$summary" | jq -r '.AccountMFAEnabled')
          keys=$(echo "$summary" | jq -r '.AccountAccessKeysPresent')
          users=$(echo "$summary" | jq -r '.Users')
          echo "root MFA=$mfa  root access keys=$keys  IAM users=$users"
          fail=0
          [ "$mfa" = "1" ]   || { echo "::error::Root account has NO MFA. Everything here is IAM-layer; root bypasses all of it."; fail=1; }
          [ "$keys" = "0" ]  || { echo "::error::Root access keys exist ($keys). Root should never have long-lived keys."; fail=1; }
          [ "$users" = "0" ] || { echo "::error::IAM users exist ($users). This account uses Identity Center and OIDC only."; fail=1; }
          exit $fail

      # WARNING, not a failure: confirming a subscription needs a human to click
      # a link, so failing here would block all merges on an action no CI run can
      # take. Promote to a hard failure once both are confirmed.
      - name: Cost alerts have confirmed subscribers
        run: |
          confirmed=$(aws sns get-topic-attributes --region us-east-1 \
            --topic-arn arn:aws:sns:us-east-1:812642122818:marcusdunnca-cost-alerts \
            --query 'Attributes.SubscriptionsConfirmed' --output text)
          pending=$(aws sns get-topic-attributes --region us-east-1 \
            --topic-arn arn:aws:sns:us-east-1:812642122818:marcusdunnca-cost-alerts \
            --query 'Attributes.SubscriptionsPending' --output text)
          echo "confirmed=$confirmed pending=$pending"
          if [ "$confirmed" = "0" ]; then
            echo "::error::Cost-anomaly alerting is DEAD — 0 confirmed, $pending pending."
            echo "Anomalies publish to a topic that delivers to nobody. Click the"
            echo "confirmation links in the most recent AWS emails."
            exit 1
          fi
          if [ "$pending" != "0" ]; then
            echo "::warning::$pending cost-alert subscription(s) unconfirmed (of $((confirmed + pending)))."
            echo "Alerts still reach the $confirmed confirmed address(es), so this is"
            echo "redundancy loss rather than an outage. Editing cost_alert_emails"
            echo "recreates subscriptions and resets them to unconfirmed."
          fi
