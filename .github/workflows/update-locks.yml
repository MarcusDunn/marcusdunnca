name: refresh lock files

# Dependabot updates version *constraints*; it does not maintain
# .terraform.lock.hcl or flake.lock. This closes that gap so the actual pinned
# provider versions and hashes stay current.
on:
  schedule:
    # Mondays 06:00 UTC, after Dependabot's weekly run.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-locks
  cancel-in-progress: true

env:
  TOFU_VERSION: 1.12.5

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Refresh provider locks
        run: |
          for module in bootstrap infra; do
            echo "::group::$module"
            (
              cd "$module"
              # -backend=false is deliberate: refreshing provider hashes needs no
              # state and therefore no AWS credentials. A scheduled run's OIDC
              # subject is ref:refs/heads/main, which neither CI role trusts, so
              # this job holds no AWS access at all.
              tofu init -backend=false -upgrade -input=false

              # Record hashes for every platform we might run on, so the lock is
              # valid for CI (linux) and both Mac architectures.
              tofu providers lock \
                -platform=linux_amd64 \
                -platform=darwin_arm64 \
                -platform=darwin_amd64
            )
            echo "::endgroup::"
          done

      - name: Refresh flake.lock
        run: nix flake update

      - name: Collect changes
        id: changes
        run: |
          files="$(git diff --name-only \
            | grep -E '(\.terraform\.lock\.hcl|^flake\.lock)$' \
            | sort -u | tr '\n' ' ' | xargs || true)"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "Lock files already current."
          else
            echo "Changed: $files"
          fi

      - name: Open pull request
        if: steps.changes.outputs.files != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          cat > /tmp/body.md <<'EOF'
          Automated refresh of pinned provider hashes and the Nix flake lock.

          > [!IMPORTANT]
          > This PR needs to be merged by hand. It was authored with
          > `GITHUB_TOKEN`, and GitHub deliberately does not trigger workflow runs
          > for such PRs, so `tofu plan` will not start on its own. Close and
          > reopen the PR (or push a commit) to run the checks, then review the
          > plan before merging — merging to `main` applies immediately.
          >
          > Auto-merging this was rejected on purpose: it would require either a
          > long-lived token or a ruleset bypass actor, and this repo has neither.
          EOF

          scripts/open-lockfile-pr.sh \
            "chore/refresh-locks-${{ github.run_id }}" \
            "chore: refresh provider and flake lock files" \
            /tmp/body.md \
            ${{ steps.changes.outputs.files }}
