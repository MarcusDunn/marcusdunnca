<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No stylesheet: the app renders with browser defaults on purpose. These two
         meta tags aren't styling, they're what makes the defaults behave — without
         the viewport tag mobile Safari lays the page out at 980px and zooms out,
         and without color-scheme the default form controls stay light-on-light for
         a reader in dark mode. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Reading Trainer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
