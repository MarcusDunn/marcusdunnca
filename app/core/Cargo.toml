[package]
name = "trainer-core"
description = "Shared types and DynamoDB access for the reading-trainer handlers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# Only DynamoDB. S3, SSM and Bedrock stay in the handlers that use them — a
# shared crate that pulls in every SDK makes both binaries pay for it.
aws-sdk-dynamodb = { version = "1.123.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_dynamo = { version = "4.3.0", features = ["aws-sdk-dynamodb+1"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tracing = "0.1.44"
