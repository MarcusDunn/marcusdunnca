[package]
name = "generate"
description = "Turns an uploaded PDF into a graded quiz, triggered by S3 ObjectCreated."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
trainer-core = { version = "0.1.0", path = "../core" }

aws-config = { version = "1.11.0", features = ["behavior-version-latest"] }
aws-sdk-bedrockruntime = "1.142.0"
aws-sdk-dynamodb = "1.123.0"
aws-sdk-s3 = "1.144.0"
# Only the S3 event shape. The default feature set of aws_lambda_events compiles
# every AWS event type there is, which is a lot of code for one struct.
aws_lambda_events = { version = "1.2.0", default-features = false, features = ["s3"] }
lambda_runtime = "1.3.0"
# Page counting only, so none of the default features (rayon, three date
# libraries) are wanted. This crate never writes a PDF.
lopdf = { version = "0.44.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"
