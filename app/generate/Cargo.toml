[package]
name = "generate"
description = "Turns an uploaded PDF into a graded quiz, triggered by S3 ObjectCreated."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
trainer-core = { version = "0.1.0", path = "../core" }

aws-config = { version = "1.11.0", default-features = false, features = ["behavior-version-latest", "rt-tokio", "default-https-client"] }
aws-sdk-dynamodb = { version = "1.123.0", default-features = false, features = ["rt-tokio", "default-https-client"] }
aws-sdk-s3 = { version = "1.144.0", default-features = false, features = ["rt-tokio", "default-https-client", "http-1x"] }
# Bedrock's Messages-API endpoint has no generated SDK crate and Anthropic ships
# no Rust SDK, so the call is signed and posted by hand. Both of these are
# already in the tree as transitive dependencies of aws-config — named here
# because mantle.rs uses them directly, not because they are new weight.
aws-credential-types = "1.3.0"
aws-sigv4 = "1.5.1"
# The PDF goes to this endpoint base64-encoded in a `document` content block.
# Converse took raw bytes in a Blob and did this itself.
base64 = "0.21.7"
# The one genuinely new dependency. hyper and rustls are already compiled in
# under aws-config's default-https-client, so this is a thin layer over them
# rather than a second TLS stack — which matters because the release profile here
# is tuned for cold-start binary size, not throughput.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Only the S3 event shape. The default feature set of aws_lambda_events compiles
# every AWS event type there is, which is a lot of code for one struct.
aws_lambda_events = { version = "1.2.0", default-features = false, features = ["s3"] }
lambda_runtime = "1.3.0"
# Page counting only, so none of the default features (rayon, three date
# libraries) are wanted. This crate never writes a PDF.
lopdf = { version = "0.44.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"
